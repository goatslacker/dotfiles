[general]
import = ["~/.config/alacritty/kanagawa-wave.toml"]
live_config_reload = true

[font]
size = 13.5

[font.bold]
family = "Fira Code"
style = "Bold"

[font.italic]
family = "Fira Code"

[font.normal]
family = "Fira Code"
style = "Retina"

[[mouse.bindings]]
mouse = "Right"
action = "Paste"

[selection]
save_to_clipboard = true

[window]
decorations = "Full"
startup_mode = "Maximized"
